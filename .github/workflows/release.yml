name: Release

on:
  push:
    tags: ['v*']
  # Re-publish an existing tag, e.g. to backfill missing notes or assets.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v1.0.1'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check VERSION matches the tag
        run: |
          v="$(sed -n 's/^VERSION="\(.*\)"$/\1/p' nginx-vhost)"
          if [ "v$v" != "$TAG" ]; then
            echo "::error::nginx-vhost has VERSION=$v but the tag is $TAG"
            exit 1
          fi
      - name: shellcheck
        run: shellcheck nginx-vhost install.sh tests/run.sh
      - name: tests
        run: ./tests/run.sh
      - name: Publish release with the script attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum nginx-vhost > nginx-vhost.sha256
          # Release notes: this version's section of CHANGELOG.md.
          awk -v v="${TAG#v}" '
            /^## \[/ { p = index($0, "[" v "]") > 0; next }
            /^\[[^]]*\]: / { p = 0 }
            p' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Created in the GitHub UI: fill in the notes only if they're empty,
            # so notes written by hand are never overwritten.
            if [ -z "$(gh release view "$TAG" --json body --jq '(.body // "") | gsub("\\s"; "")')" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" nginx-vhost nginx-vhost.sha256 --clobber
